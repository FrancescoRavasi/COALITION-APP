services:
  - type: web
    name: coalition-team-platform
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coalition-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "coalition-team-platform.onrender.com,.onrender.com"

databases:
  - name: coalition-db
    databaseName: coalition
    user: coalition_user
    plan: free
