version: "3.9"

services:
  db:
    image: postgres:15-alpine
    platform: linux/arm64
    restart: unless-stopped
    environment:
      POSTGRES_DB: coalition
      POSTGRES_USER: coalition
      POSTGRES_PASSWORD: password   # <-- cambia in .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coalition -d coalition"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: Raspberry/Dockerfile.rpi
    platform: linux/arm64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: gotta_bike_platform.settings_rpi
      DATABASE_URL: postgresql://coalition:password@db:5432/coalition  # <-- allinea con .env
    volumes:
      - staticfiles:/app/staticfiles
      - mediafiles:/app/media

volumes:
  pgdata:
  staticfiles:
  mediafiles:
